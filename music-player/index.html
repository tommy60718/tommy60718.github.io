---
layout: default
title: Music Player
---

<div class="music-player-page">
  <h1>Music & Mood Player</h1>
  
  <div class="player-container">
    <div id="audio-player" class="audio-player">
      <div class="player-artwork">
        <img id="track-artwork" src="/assets/images/default-artwork.jpg" alt="Track Artwork">
        <div class="mood-visualization" id="visualization-canvas"></div>
      </div>
      
      <div class="player-info">
        <h2 id="track-title">Select a track</h2>
        <p id="track-artist">...</p>
      </div>
      
      <div class="player-controls">
        <div class="progress-container">
          <div class="progress-bar" id="progress-bar">
            <div class="progress" id="progress"></div>
          </div>
          <div class="time-display">
            <span id="current-time">0:00</span> / <span id="duration">0:00</span>
          </div>
        </div>
        
        <div class="control-buttons">
          <button id="prev-button" class="control-button">
            <span class="icon">⏮️</span>
          </button>
          <button id="play-button" class="control-button">
            <span class="icon">▶️</span>
          </button>
          <button id="next-button" class="control-button">
            <span class="icon">⏭️</span>
          </button>
          <div class="volume-control">
            <span class="icon">🔊</span>
            <input type="range" id="volume-slider" min="0" max="100" value="80">
          </div>
        </div>
      </div>
    </div>
    
    <div class="mood-selector">
      <h3>Select Mood Visualization:</h3>
      <div class="mood-buttons">
        <button class="mood-button" data-mood="calm">Calm</button>
        <button class="mood-button" data-mood="energetic">Energetic</button>
        <button class="mood-button" data-mood="focus">Focus</button>
      </div>
    </div>
    
    <div class="playlist-container">
      <h3>Playlist</h3>
      <ul id="playlist" class="playlist">
        <!-- Playlist items will be dynamically inserted here -->
      </ul>
    </div>
  </div>
</div>
