<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/sidebar.css">
  <link rel="stylesheet" href="/assets/css/music-station.css">
  <link rel="stylesheet" href="/assets/css/intro-animation.css">
  {% if page.title == "About" %}
  <link rel="stylesheet" href="/assets/css/about.css">
  {% endif %}
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  {% seo %}
</head>
<body class="intro-layout">
  <!-- Intro Animation Container -->
  <div class="intro-animation" id="intro-animation">
    <div class="intro-content">
      <h1 class="intro-title">Lin Yang Sen</h1>
      <p class="intro-subtitle">Music & Mood Explorer</p>
    </div>
    <div class="geometry-container">
      <svg class="geometry" viewBox="0 0 800 800">
        <g class="dots"></g>
        <g class="line"></g>
      </svg>
    </div>
    <div class="scroll-indicator">
      <span>Scroll Down</span>
      <div class="arrow">↓</div>
    </div>
  </div>

  <!-- Main Website Content -->
  <div class="site-container" id="main-site">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-profile">
        <img src="/assets/images/profile.jpg" alt="Profile Photo" class="profile-image" onerror="this.src='/assets/images/default-avatar.png'">
        <h3 class="sidebar-name">Lin Yang Sen</h3>
        <p class="sidebar-title">Music & Mood Explorer</p>
      </div>
      
      <nav class="sidebar-nav">
        <ul>
          <li><a href="/" class="sidebar-nav-item">
            <span class="sidebar-icon">🏠</span>
            <span class="sidebar-label">Home</span>
          </a></li>
          <li><a href="/blog" class="sidebar-nav-item">
            <span class="sidebar-icon">📝</span>
            <span class="sidebar-label">Blog</span>
          </a></li>
          <li><a href="/music-station" class="sidebar-nav-item">
            <span class="sidebar-icon">🎵</span>
            <span class="sidebar-label">Music Station</span>
          </a></li>
          <li><a href="/about" class="sidebar-nav-item">
            <span class="sidebar-icon">ℹ️</span>
            <span class="sidebar-label">About</span>
          </a></li>
        </ul>
      </nav>
      
      <div class="sidebar-footer">
        <div class="social-links">
          <a href="https://github.com/tommy60718" class="social-link">
            <span class="sidebar-icon">GitHub</span>
          </a>
          <a href="mailto:tommyforwork@gmail.com" class="social-link">
            <span class="sidebar-icon">Email</span>
          </a>
        </div>
        <p class="copyright">&copy; {{ site.time | date: '%Y' }} Lin Yang Sen</p>
      </div>
    </aside>
    
    <!-- Main Content Area -->
    <div class="main-content">
      <main class="content">
        {{ content }}
      </main>
      
      {% include footer.html %}
    </div>
  </div>
  
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/intro-animation.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const path = window.location.pathname;
      const navItems = document.querySelectorAll('.sidebar-nav-item');
      
      navItems.forEach(item => {
        const href = item.getAttribute('href');
        if (path === href || path.startsWith(href) && href !== '/') {
          item.classList.add('active');
        }
      });
      
      if (document.querySelector('.station-nav')) {
        const stationItems = document.querySelectorAll('.station-nav-item');
        stationItems.forEach(item => {
          if (path === item.getAttribute('href') || path.startsWith(item.getAttribute('href'))) {
            item.classList.add('active');
          }
        });
      }
    });
  </script>
</body>
</html>
